name: Deploy Backend to VPS

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔐 Логин в GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🐳 Build + Push образа
      - name: Build & Push Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/turbo-metallurg-montazh/emk-backend:${{ github.sha }}

      # 🚀 Deploy в k3s
      - name: Deploy to k3s
        run: |
          echo "${{ secrets.K3S_KUBECONFIG }}" > kubeconfig
          kubectl --kubeconfig=kubeconfig apply -f k8s/ -R
          kubectl --kubeconfig=kubeconfig set image deployment/emk-backend \
          backend=ghcr.io/turbo-metallurg-montazh/emk-backend:${{ github.sha }} \
          -n backend
          kubectl --kubeconfig=kubeconfig rollout status deployment/emk-backend \
          -n backend --timeout=650s