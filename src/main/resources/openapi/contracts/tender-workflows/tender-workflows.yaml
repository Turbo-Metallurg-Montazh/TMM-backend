tenderWorkflows:
  get:
    tags: [TenderWorkflows]
    summary: List tender workflows
    operationId: listTenderWorkflows
    parameters:
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: priority
        schema:
          type: string
      - in: query
        name: responsibleManagerId
        schema:
          type: integer
          format: int64
      - in: query
        name: supplyUserId
        schema:
          type: integer
          format: int64
      - in: query
        name: lawyerUserId
        schema:
          type: integer
          format: int64
      - in: query
        name: purchaseTenderId
        schema:
          type: integer
          format: int64
      - in: query
        name: notificationNumber
        schema:
          type: string
      - in: query
        name: inn
        schema:
          type: string
      - in: query
        name: dateFrom
        schema:
          type: string
          format: date-time
      - in: query
        name: dateTo
        schema:
          type: string
          format: date-time
      - in: query
        name: page
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - in: query
        name: size
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
          maximum: 100
      - in: query
        name: sort
        schema:
          type: string
          default: updatedAt
      - in: query
        name: direction
        schema:
          type: string
          default: DESC
    responses:
      '200':
        description: Workflow page
        content:
          application/json:
            schema:
              $ref: "../../models/tender-workflows.yaml#/components/schemas/TenderWorkflowPageResponse"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"
  post:
    tags: [TenderWorkflows]
    summary: Create tender workflow
    operationId: createTenderWorkflow
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../models/tender-workflows.yaml#/components/schemas/TenderWorkflowCreateRequest"
    responses:
      '201':
        description: Workflow created
        content:
          application/json:
            schema:
              $ref: "../../models/tender-workflows.yaml#/components/schemas/TenderWorkflowDetailsResponse"
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"
      '404':
        description: Purchase tender not found
        content:
          application/json:
            schema:
              $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"
      '409':
        description: Workflow already exists for tender
        content:
          application/json:
            schema:
              $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"

