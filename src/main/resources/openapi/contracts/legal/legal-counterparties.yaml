        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"
