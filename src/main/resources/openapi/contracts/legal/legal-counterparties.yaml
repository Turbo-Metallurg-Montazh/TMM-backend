legalCounterparties:
  get:
    tags: [LegalCounterparties]
    summary: Search legal counterparty registry
    description: Поиск по реестру контрагентов и поставщиков юридического отдела.
    operationId: searchLegalCounterparties
    parameters:
      - in: query
        name: query
        required: false
        schema:
          type: string
        description: Поиск по названию, ИНН, КПП или ОГРН.
      - in: query
        name: registryType
        required: false
        schema:
          type: string
        description: CUSTOMER, SUPPLIER или BOTH.
      - in: query
        name: riskLevel
        required: false
        schema:
          type: string
        description: UNKNOWN, LOW, MEDIUM, HIGH или CRITICAL.
      - in: query
        name: workProhibited
        required: false
        schema:
          type: boolean
        description: Фильтр по флагу "категорически нельзя работать".
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
          maximum: 100
    responses:
      '200':
        description: Registry page
        content:
          application/json:
            schema:
              $ref: "../../models/legal-counterparties.yaml#/components/schemas/LegalCounterpartyPageResponse"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"

  post:
    tags: [LegalCounterparties]
    summary: Create legal counterparty
    description: Создает запись компании в юридическом реестре.
    operationId: createLegalCounterparty
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../models/legal-counterparties.yaml#/components/schemas/LegalCounterpartyUpsertRequest"
    responses:
      '201':
        description: Counterparty created
        content:
          application/json:
            schema:
              $ref: "../../models/legal-counterparties.yaml#/components/schemas/LegalCounterpartyDetailsResponse"
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"
      '409':
        description: Counterparty with the same INN already exists
        content:
          application/json:
            schema:
              $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"

legalCounterpartyAssessment:
  get:
    tags: [LegalCounterparties]
    summary: Get counterparty assessment by INN
    description: Возвращает компактную юридическую оценку компании для использования при расчете коммерческого предложения.
    operationId: getLegalCounterpartyAssessment
    parameters:
      - in: query
        name: inn
        required: true
        schema:
          type: string
        description: ИНН компании.
    responses:
      '200':
        description: Counterparty assessment
        content:
          application/json:
            schema:
              $ref: "../../models/legal-counterparties.yaml#/components/schemas/LegalCounterpartyAssessmentResponse"
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"
      '404':
