login:
  post:
    tags: [Auth]
    summary: Login using username or email
    description: >
      Аутентификация по корпоративной учетной записи.
      Для входа можно передать username или email (в поле username или в поле email).
      Username формируется автоматически на основе ФИО сотрудника
      (например: m.nachinkin, m.a.nachinkin, m.a.nachinkin1).
    operationId: login

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../models/auth.yaml#/components/schemas/LoginRequest"

    responses:

      '200':
        description: Login successful
        headers:
          Set-Cookie:
            description: HttpOnly access_token and refresh_token cookies plus readable XSRF-TOKEN cookie.
            schema:
              type: string
        content:
          application/json:
            schema:
              title: Login200Response
              allOf:
                - $ref: "../../models/auth.yaml#/components/schemas/MessageResponse"

      '401':
        description: Invalid login or password
        content:
          application/json:
            schema:
              title: Login401Response
              allOf:
                - $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"

      '423':
        description: User account is disabled
        content:
          application/json:
            schema:
              title: Login423Response
              allOf:
                - $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"

      '501':
        description: Not implemented
        content:
          application/json:
            schema:
              title: Login501Response
              allOf:
                - $ref: "../../models/auth.yaml#/components/schemas/MessageResponse"

refresh:
  post:
    tags: [Auth]
    summary: Refresh current session using refresh cookie
    operationId: refresh
    responses:
      '200':
        description: Session refreshed
        headers:
          Set-Cookie:
            description: Rotated HttpOnly access_token and refresh_token cookies plus readable XSRF-TOKEN cookie.
            schema:
              type: string
        content:
          application/json:
            schema:
              title: Refresh200Response
              allOf:
                - $ref: "../../models/auth.yaml#/components/schemas/MessageResponse"

      '401':
        description: Missing, invalid, expired, or revoked refresh token
        content:
          application/json:
            schema:
              title: Refresh401Response
              allOf:
                - $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"

logout:
  post:
    tags: [Auth]
    summary: Logout current session and clear auth cookies
    operationId: logout
    responses:
      '200':
        description: Session closed
        headers:
          Set-Cookie:
            description: Expired auth cookies.
            schema:
              type: string
        content:
          application/json:
            schema:
              title: Logout200Response
              allOf:
                - $ref: "../../models/auth.yaml#/components/schemas/MessageResponse"

passwordResetConfirm:
  post:
    tags: [Auth]
    summary: Confirm password reset by token
    operationId: confirmPasswordReset
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../models/auth.yaml#/components/schemas/PasswordResetConfirmRequest"
    responses:
      '200':
        description: Password reset successful
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../models/auth.yaml#/components/schemas/MessageResponse"

      '400':
        description: Invalid request or expired token
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../models/auth.yaml#/components/schemas/ErrorResponse"

      '501':
        description: Not implemented
        content:
          application/json:
            schema:
              title: ConfirmPasswordReset501Response
              allOf:
                - $ref: "../../models/auth.yaml#/components/schemas/MessageResponse"
