openapi: 3.0.3
info:
  title: Corporate Authentication API
  version: 1.0.0
  description: >
    Аутентификация пользователей во внутренней корпоративной сети.
    Самостоятельная регистрация отключена; учетные записи создаются и управляются администраторами.

paths:
  # Аутентификация пользователя (корпоративная учетная запись)
  /login:
    $ref: "./contracts/auth/login.yaml#/login"

  /refresh:
    $ref: "./contracts/auth/login.yaml#/refresh"

  /logout:
    $ref: "./contracts/auth/login.yaml#/logout"

  /password-reset/confirm:
    $ref: "./contracts/auth/login.yaml#/passwordResetConfirm"

  # Эндпоинты панели администратора для управления пользователями
  /admin/users:
    $ref: "./contracts/auth/admin-users.yaml#/adminUsers"

  /admin/users/{username}:
    $ref: "./contracts/auth/admin-users.yaml#/adminUserByUsername"

  /admin/users/reset-password:
    $ref: "./contracts/auth/admin-users.yaml#/adminUserResetPassword"

  /admin/users/{username}/enabled:
    $ref: "./contracts/auth/admin-users.yaml#/adminUserEnabled"

  /users/me:
    $ref: "./contracts/auth/users.yaml#/currentUser"

  /admin/roles:
    $ref: "./contracts/auth/rbac-admin.yaml#/adminRoles"

  /admin/permissions:
    $ref: "./contracts/auth/rbac-admin.yaml#/adminPermissions"

  /admin/roles/{roleCode}/permissions:
    $ref: "./contracts/auth/rbac-admin.yaml#/adminRolePermissions"

  /admin/users/{username}/roles:
    $ref: "./contracts/auth/rbac-admin.yaml#/adminUserRoles"

  /public-ai/chat:
    $ref: "./contracts/openai/ask-ai.yaml#/ask-open-ai"

  /tender-filters:
    $ref: "./contracts/tenders/tender-filters.yaml#/tenderFilters"

  /tender-filters/parse:
    $ref: "./contracts/tenders/tender-filters.yaml#/tenderFiltersParse"

  /tender-filters/export:
    $ref: "./contracts/tenders/tender-filters.yaml#/tenderFiltersExport"

  /tender-filters/{filterName}:
    $ref: "./contracts/tenders/tender-filters.yaml#/tenderFilterByName"

  /legal/counterparties:
    $ref: "./contracts/legal/legal-counterparties.yaml#/legalCounterparties"

  /legal/counterparties/assessment:
    $ref: "./contracts/legal/legal-counterparties.yaml#/legalCounterpartyAssessment"

  /legal/counterparties/{counterpartyId}:
    $ref: "./contracts/legal/legal-counterparties.yaml#/legalCounterpartyById"

  /legal/counterparties/{counterpartyId}/checks:
    $ref: "./contracts/legal/legal-counterparties.yaml#/legalCounterpartyChecks"

  /legal/counterparties/{counterpartyId}/incidents:
    $ref: "./contracts/legal/legal-counterparties.yaml#/legalCounterpartyIncidents"

  /legal/counterparties/{counterpartyId}/incidents/{incidentId}:
    $ref: "./contracts/legal/legal-counterparties.yaml#/legalCounterpartyIncidentById"

  /api/tender-workflows:
    $ref: "./contracts/tender-workflows/tender-workflows.yaml#/tenderWorkflows"

  /api/tender-workflows/{id}:
    $ref: "./contracts/tender-workflows/tender-workflows.yaml#/tenderWorkflowById"

  /api/tender-workflows/{id}/status:
    $ref: "./contracts/tender-workflows/tender-workflows.yaml#/tenderWorkflowStatus"

  /api/tender-workflows/{id}/history:
    $ref: "./contracts/tender-workflows/tender-workflows.yaml#/tenderWorkflowHistory"

  /api/tender-workflows/{id}/comments:
    $ref: "./contracts/tender-workflows/tender-workflows.yaml#/tenderWorkflowComments"

  /api/tender-workflows/{id}/comments/{commentId}:
    $ref: "./contracts/tender-workflows/tender-workflows.yaml#/tenderWorkflowCommentById"

  /api/tender-workflows/{id}/files:
    $ref: "./contracts/tender-workflows/tender-workflows.yaml#/tenderWorkflowFiles"

  /api/tender-workflows/{id}/files/{fileId}:
    $ref: "./contracts/tender-workflows/tender-workflows.yaml#/tenderWorkflowFileById"

  /api/tender-workflows/{id}/counterparty:
    $ref: "./contracts/tender-workflows/tender-workflows.yaml#/tenderWorkflowCounterparty"

  /api/tender-workflows/{id}/counterparty-link:
    $ref: "./contracts/tender-workflows/tender-workflows.yaml#/tenderWorkflowCounterpartyLink"

  /api/tender-workflows/{id}/counterparty-check:
    $ref: "./contracts/tender-workflows/tender-workflows.yaml#/tenderWorkflowCounterpartyCheck"

  /api/warehouse/illiquid-assets:
    $ref: "./contracts/warehouse/illiquid-assets.yaml#/illiquidAssets"

  /api/warehouse/illiquid-assets/{id}:
    $ref: "./contracts/warehouse/illiquid-assets.yaml#/illiquidAssetById"

  /api/warehouse/illiquid-assets/{id}/quantity:
    $ref: "./contracts/warehouse/illiquid-assets.yaml#/illiquidAssetQuantity"

  /api/warehouse/illiquid-assets/{id}/close:
    $ref: "./contracts/warehouse/illiquid-assets.yaml#/illiquidAssetClose"

  /api/warehouse/illiquid-assets/{id}/history:
    $ref: "./contracts/warehouse/illiquid-assets.yaml#/illiquidAssetHistory"
