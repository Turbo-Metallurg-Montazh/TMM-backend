spring:
  application:
    name: EMK-CRM_Project_backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jpa:
    defer-datasource-initialization: false
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        connection:
          provider_disables_autocommit: false
        jdbc:
          time_zone: UTC

  mail:
    host: smtp.mail.ru
    port: 465
    username: ${SPRING_MAIL_USERNAME:no-reply@example.com}
    password: ${SPRING_MAIL_PASSWORD:change-me}
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

security:
  auth:
    allowed-origins: ${SECURITY_AUTH_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,https://turbo-metallurg-montazh.ru,https://www.turbo-metallurg-montazh.ru}
    cookie:
      secure: ${SECURITY_AUTH_COOKIE_SECURE:true}
      same-site: ${SECURITY_AUTH_COOKIE_SAME_SITE:Strict}
      domain: ${SECURITY_AUTH_COOKIE_DOMAIN:}
      cleanup-domains: ${SECURITY_AUTH_COOKIE_CLEANUP_DOMAINS:api.turbo-metallurg-montazh.ru,turbo-metallurg-montazh.ru}
  jwt:
    token:
      secret-key: ${SECURITY_JWT_TOKEN_SECRET_KEY:change-me-change-me-change-me-change-me}
      expire-length: ${SECURITY_JWT_ACCESS_TOKEN_EXPIRE_LENGTH:900000} # 15 minutes
    refresh-token:
      expire-length: ${SECURITY_JWT_REFRESH_TOKEN_EXPIRE_LENGTH:604800000} # 7 days

logging:
  level:
    root: INFO
    com.kindred.emkcrm_project_backend: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
    org.flywaydb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    mail:
      enabled: false

external-api:
  kontur:
    api-key-header: X-Kontur-Apikey
    api-key: ${KONTUR_API_KEY:change-me}
    base-url: https://api-zakupki.kontur.ru

email:
  domain: mail.com
  activation-link: http://localhost:8080/api/activate?token=
  host-email: ${EMAIL_HOST:no-reply@example.com}
  login-url: https://turbo-metallurg-montazh.ru/login
  password-reset-url: ${PASSWORD_RESET_URL:https://turbo-metallurg-montazh.ru/reset-password}

activation:
  key: ${ACTIVATION_KEY:change-me-change-me-change-me-change-me}
  expiration-ms: 8640000   # 360000 * 24

pagination:
  items-on-page: 50

schedule:
  time: "0 0 3 * * ?"
  password-reset-cleanup-cron: "0 0 23 * * SUN"
  refresh-token-cleanup-cron: "0 0 23 * * SUN"

format:
  date-time: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"

