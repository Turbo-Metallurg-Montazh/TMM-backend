apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: emk-backend
  namespace: backend
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: emk-backend
  namespaceSelector:
    matchNames:
      - backend
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s