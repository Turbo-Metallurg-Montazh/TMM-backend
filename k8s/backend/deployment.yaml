apiVersion: apps/v1
kind: Deployment
metadata:
  name: emk-backend
  namespace: backend
spec:
  replicas: 2
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

  selector:
    matchLabels:
      app: emk-backend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: emk-backend

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: backend
          image: ghcr.io/turbo-metallurg-montazh/emk-backend:latest
          imagePullPolicy: IfNotPresent

          envFrom:
            - secretRef:
                name: backend-secrets

          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx768m -XX:+UseG1GC"

          ports:
            - containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6